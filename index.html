<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Le Programme — 5 séances</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Programme">
<meta name="theme-color" content="#EFECE7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#100F0E" media="(prefers-color-scheme:dark)">
<meta name="description" content="Programme de musculation 5 séances : charges, repos, chrono abdos.">
<script>window.__PWA__=1</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <div class="tb-title" id="tbTitle">LE PROGRAMME</div>
      <div class="tb-sub" id="tbSub">5 séances par semaine</div>
    </div>
    <div class="tb-right" id="tbRight"></div>
  </header>

  <main id="view"></main>

  <nav id="tabs">
    <button class="tab is-on" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v15H4z"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/></svg>
      <span>Aujourd'hui</span>
    </button>
    <button class="tab" data-view="progress">
      <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span>Progrès</span>
    </button>
    <button class="tab" data-view="history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      <span>Historique</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      <span>Réglages</span>
    </button>
  </nav>
</div>

<!-- Écran de repos plein écran -->
<div id="restScreen" hidden>
  <div class="rs-in">
    <div class="rs-label">REPOS</div>
    <div class="rs-time" id="rsTime">1:30</div>
    <div class="rs-bar"><i id="rsBar"></i></div>
    <div class="rs-next" id="rsNext"></div>
    <div class="rs-adj">
      <button class="rs-btn" id="rsMinus">− 15 s</button>
      <button class="rs-btn" id="rsPlus">+ 15 s</button>
    </div>
    <button class="rs-go" id="rsSkip">C'est bon, j'enchaîne</button>
  </div>
</div>

<!-- Chrono abdos 6 min -->
<div id="absOverlay" hidden>
  <div class="ab-inner">
    <div class="ab-total" id="abTotal">6:00</div>
    <div class="ab-phase" id="abPhase">GAINAGE</div>
    <div class="ab-time" id="abTime">30</div>
    <div class="ab-next" id="abNext">Ensuite : abdos</div>
    <div class="ab-dots" id="abDots"></div>
    <div class="ab-row">
      <button class="rs-btn" id="abPause">Pause</button>
      <button class="rs-btn rs-quit" id="abQuit">Arrêter</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<style>
/* ============ jetons ============ */
:root{
  --bg:#EFECE7;
  --card:#FFFFFF;
  --card2:#F6F3EF;
  --ink:#17140F;
  --ink2:#6E665B;
  --line:#DED8CF;
  --accent:#C2381C;
  --accent-ink:#FFFFFF;
  --accent-soft:#F6E2DC;
  --ok:#2E6B4B;
  --ok-soft:#E1EFE7;
  --warn:#9A6B0E;
  --warn-soft:#F6EBD5;
  --shadow:0 1px 2px rgba(23,20,15,.06), 0 8px 24px rgba(23,20,15,.06);
  --f-display:"DIN Condensed","DIN Alternate","Oswald","Haettenschweiler","Arial Narrow",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100F0E; --card:#1B1917; --card2:#232019; --ink:#F2EDE6; --ink2:#968C7E;
    --line:#302B26; --accent:#FF5A33; --accent-ink:#1A0E09; --accent-soft:#33201A;
    --ok:#56B183; --ok-soft:#17281F; --warn:#E0A63A; --warn-soft:#2A2113;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#100F0E; --card:#1B1917; --card2:#232019; --ink:#F2EDE6; --ink2:#968C7E;
  --line:#302B26; --accent:#FF5A33; --accent-ink:#1A0E09; --accent-soft:#33201A;
  --ok:#56B183; --ok-soft:#17281F; --warn:#E0A63A; --warn-soft:#2A2113;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  touch-action:manipulation;          /* pas de zoom au double-tap */
}
/* comportement d'appli : rien n'est sélectionnable sauf ce qu'on saisit */
body{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============ structure ============ */
#app{max-width:560px;margin:0 auto;min-height:100vh}
#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);
}
.tb-title{font-family:var(--f-display);font-size:23px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05}
.tb-sub{font-size:12px;color:var(--ink2);letter-spacing:.02em}
.tb-right{display:flex;align-items:center;gap:8px}
.tb-chip{
  font-family:var(--f-display);font-size:19px;letter-spacing:.04em;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:3px 12px;font-variant-numeric:tabular-nums;
}
.tb-chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

#view{padding:16px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}

#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 92%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
}
.tab{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);font-size:10.5px;cursor:pointer}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.is-on{color:var(--accent)}

/* ============ briques ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 15px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--ink2)}
h2.sec{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:20px;margin:6px 0 -2px;font-weight:400}
.muted{color:var(--ink2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.hero-top{padding:16px 16px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero-day{color:var(--accent);font-family:var(--f-display);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.hero-name{font-family:var(--f-display);font-size:40px;line-height:.98;text-transform:uppercase;letter-spacing:.02em;margin-top:2px}
.hero-meta{font-size:13px;color:var(--ink2);margin-top:6px}
.hero-badge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);font-family:var(--f-display);font-size:22px}
.hero-badge.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.hero-act{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-family:var(--f-display);font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}

.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wd{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 4px 8px;text-align:center;cursor:pointer}
.wd .l{font-family:var(--f-display);font-size:17px;letter-spacing:.06em}
.wd .m{font-size:9.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.wd .dot{width:7px;height:7px;border-radius:50%;background:var(--line);margin:6px auto 0}
.wd.done{background:var(--ok-soft);border-color:transparent}
.wd.done .dot{background:var(--ok)}
.wd.today{border-color:var(--accent);border-width:2px}
.wd.today .l{color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:29px;line-height:1;font-weight:400}
.stat span{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}

.prot-bar{height:9px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prot-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.prot-bar i.full{background:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:8px 13px;font-size:14px;cursor:pointer}
.chip:active{background:var(--accent-soft)}

/* ============ MODE SALLE — un exercice à la fois ============ */
.g-bar{display:flex;align-items:center;gap:10px}
.g-bar .pgm{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.g-bar .pgm i{display:block;height:100%;background:var(--accent);transition:width .3s}
.g-bar .cnt{font-family:var(--f-display);font-size:16px;color:var(--ink2);font-variant-numeric:tabular-nums;letter-spacing:.04em}

.guide{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 16px 16px}
.g-pos{font-family:var(--f-display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.g-nom{font-size:23px;font-weight:650;line-height:1.15;margin-top:4px;text-wrap:balance}
.g-serie{font-family:var(--f-display);font-size:30px;letter-spacing:.05em;text-transform:uppercase;margin-top:10px;line-height:1}
.g-obj{font-size:14px;color:var(--ink2);margin-top:3px}
.g-note{margin-top:12px;padding:10px 12px;background:var(--card2);border-radius:11px;font-size:13.5px;color:var(--ink2);border-left:3px solid var(--accent)}

.stepper{margin-top:16px}
.st-lab{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase;margin-bottom:6px}
.st-row{display:grid;grid-template-columns:66px 1fr 66px;gap:9px;align-items:stretch}
.st-b{
  border:1px solid var(--line);background:var(--card2);border-radius:14px;cursor:pointer;
  font-size:30px;line-height:1;display:grid;place-items:center;padding:0;user-select:none;
}
.st-b:active{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.st-v{
  border:1px solid var(--line);background:var(--card2);border-radius:14px;cursor:pointer;
  padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
}
.st-v b{font-family:var(--f-display);font-size:44px;line-height:.92;font-weight:400;font-variant-numeric:tabular-nums}
.st-v span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);margin-top:2px}
.st-v input{
  width:100%;border:0;background:none;color:var(--ink);text-align:center;
  font-family:var(--f-display);font-size:44px;line-height:.92;padding:0;
  font-variant-numeric:tabular-nums;-webkit-appearance:none;
}
.st-v input:focus{outline:none}
.pdc{
  border:1px dashed var(--line);border-radius:14px;padding:13px;text-align:center;
  font-size:15px;color:var(--ink2);background:var(--card2);
}
.pdc button{background:none;border:0;color:var(--accent);font-size:14px;cursor:pointer;padding:4px 6px;text-decoration:underline}

.g-go{
  display:block;width:100%;margin-top:18px;border:0;border-radius:15px;padding:19px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;
  font-family:var(--f-display);font-size:26px;letter-spacing:.06em;text-transform:uppercase;
}
.g-go:active{transform:scale(.99)}
.g-go.done{background:var(--ok);color:#fff}
.g-last{text-align:center;font-size:13px;color:var(--ink2);margin-top:10px}
.g-nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.g-nav button{
  border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 8px;
  font-size:14.5px;cursor:pointer;
}
.g-nav button:disabled{opacity:.35}

/* mouvements d'un tour de circuit */
.mv{display:flex;align-items:center;gap:11px;padding:12px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--card2);cursor:pointer}
.mv.ok{background:var(--ok-soft);border-color:transparent}
.mv .box{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.mv.ok .box{background:var(--ok);border-color:transparent}
.mv .box svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.mv.ok .box svg{opacity:1}
.mv .t{font-size:15px;line-height:1.2}
.mv .r{margin-left:auto;font-family:var(--f-display);font-size:18px;color:var(--accent);letter-spacing:.04em}

/* liste complète de la séance */
.lst{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lst-h{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.lst-h b{font-size:15px}
.lst-h span{display:block;font-size:12.5px;color:var(--ink2)}
.lrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.lrow:first-of-type{border-top:0}
.lrow.ok{background:var(--ok-soft)}
.lrow.now{background:var(--accent-soft)}
.lrow .n{font-family:var(--f-display);font-size:16px;color:var(--ink2)}
.lrow.now .n{color:var(--accent)}
.lrow .t{font-size:14px;line-height:1.25;min-width:0}
.lrow .t em{display:block;font-style:normal;font-size:12px;color:var(--ink2)}
.lrow .v{font-family:var(--f-display);font-size:17px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ============ historique / progrès / règles / réglages ============ */
.hrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .d{flex:none;width:44px;text-align:center}
.hrow .d b{display:block;font-family:var(--f-display);font-size:22px;line-height:1;font-weight:400}
.hrow .d span{font-size:10px;text-transform:uppercase;color:var(--ink2);letter-spacing:.06em}
.hrow .t{flex:1;min-width:0}
.hrow .t b{display:block;font-size:15px;font-weight:600}
.hrow .t span{font-size:12.5px;color:var(--ink2)}

.prow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:active{background:var(--card2)}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-size:14.5px;font-weight:600;line-height:1.2}
.prow .t span{font-size:12px;color:var(--ink2)}
.prow .v{font-family:var(--f-display);font-size:23px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:2px}
.prow .v em{font-style:normal;font-size:12px;color:var(--ink2);font-family:var(--f-body)}

/* ---- graphiques ---- */
.chart{width:100%;height:auto;display:block;margin:10px 0 2px;overflow:visible}
.chart .trait{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart .aire{stroke:none}
.chart .gr-h{stop-color:var(--accent);stop-opacity:.22}
.chart .gr-b{stop-color:var(--accent);stop-opacity:0}
.chart .pt{fill:var(--accent);opacity:.5}
.chart .pt-fin{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .lab{font-family:var(--f-body);font-size:10px;fill:var(--ink2)}
.chart .lab.fin{text-anchor:end}
.chart .bar{fill:var(--accent);opacity:.35}
.chart .bar.last{opacity:1}
.chart-vide{font-size:13px;color:var(--ink2);padding:14px 0 4px;text-align:center}

/* ---- poids du corps & écarts ---- */
.poids-h{display:flex;align-items:baseline;gap:5px;margin-top:2px}
.poids-h b{font-family:var(--f-display);font-size:46px;line-height:1;font-weight:400}
.poids-h span{font-size:16px;color:var(--ink2)}
.deltas{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.delta{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.delta em{font-style:normal;color:var(--ink2);font-size:11px}
.delta.up{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.delta.down{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.up{color:var(--ok)}
.stat b.up{color:var(--ok)}
.flag.rec{background:var(--accent-soft);color:var(--accent);margin-left:4px}
.retour{background:none;border:0;color:var(--accent);font-size:15px;padding:2px 0;cursor:pointer;text-align:left;align-self:flex-start}
.spark{width:66px;height:26px;flex:none}
.spark path{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--accent)}
.flag{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:99px;margin-top:3px}

.rule{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.rule:last-child{border-bottom:0}
.rule .k{flex:none;width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:14px;margin-top:1px}
.final{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px}
.final .q{font-family:var(--f-display);font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.final .s{font-size:13px;opacity:.85;margin-top:7px}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{flex:1;font-size:15px}
.row .l span{display:block;font-size:12px;color:var(--ink2)}

 "Mets des charges qui t'amènent à l'échec à la 10ᵉ rep. Si c'est facile à la 10ᵉ sur les 4 séries, tu augmentes.",
 "Fais bien les exercices. Regarde des vidéos, c'est important.",

];

/* ================= état ================= */
var KEY='programme-muscu-v1';
var S={
  settings:{rest:90,restLong:120,proteine:115,son:true,ecran:true},
  histo:[], courant:null, prot:{}, poids:[]
};
try{ var raw=localStorage.getItem(KEY); if(raw){ var p=JSON.parse(raw);
  if(p.settings) for(var k in p.settings) S.settings[k]=p.settings[k];
  S.histo=p.histo||[]; S.courant=p.courant||null; S.prot=p.prot||{}; S.poids=p.poids||[];
} }catch(e){}

/* ================= utilitaires ================= */
var $=function(s,r){return (r||document).querySelector(s)};
var JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function nb(v){v=parseFloat(String(v).replace(',','.'));return isFinite(v)?v:0;}
function arr(v){return Math.round(v*10)/10}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(function(){e.hidden=true},2400);}
function sess(id){for(var i=0;i<PROGRAM.length;i++) if(PROGRAM[i].id===id) return PROGRAM[i];return null;}
function sessDuJour(){var d=new Date().getDay();for(var i=0;i<PROGRAM.length;i++) if(PROGRAM[i].dow===d) return PROGRAM[i];return null;}
function faitLe(sid,d){var k=dkey(d);for(var i=0;i<S.histo.length;i++) if(S.histo[i].sid===sid&&S.histo[i].date===k) return S.histo[i];return null;}
function lundiDe(d){var x=new Date(d);var j=(x.getDay()+6)%7;x.setDate(x.getDate()-j);x.setHours(0,0,0,0);return x;}

/* ================= son ================= */
/* Sur iPhone : audioSession 'playback' permet d'entendre le bip même
   quand le petit bouton silencieux du côté est activé. */
var AC=null, debloque=false;
function reveilAudio(){
  try{
    if(navigator.audioSession) navigator.audioSession.type='playback';
  }catch(e){}
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    if(!debloque){
      var b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
      s.buffer=b;s.connect(AC.destination);s.start(0);debloque=true;
    }
  }catch(e){}
}
function ton(freq,depart,duree,vol){
  if(!AC) return;
  var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+depart;
  o.type='square';o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.setValueAtTime(vol,t+duree-.04);
  g.gain.exponentialRampToValueAtTime(.0001,t+duree);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+duree+.02);
}
function bipCourt(){ if(!S.settings.son) return; reveilAudio(); ton(760,0,.09,.22); }
function bipFin(){
  if(!S.settings.son) return;
  reveilAudio();
  ton(784,0,.22,.7); ton(1046,.28,.22,.7); ton(1318,.56,.45,.75);
  try{ if(navigator.vibrate) navigator.vibrate([120,80,120,80,240]); }catch(e){}
}
function bipPhase(haut){
  if(!S.settings.son) return;
  reveilAudio();
  ton(haut?1046:660,0,.28,.6);
  try{ if(navigator.vibrate) navigator.vibrate(180); }catch(e){}
}

/* ---- écran allumé ---- */
var wl=null;

/* ================= charges précédentes ================= */
function derniereFois(nom){
  for(var i=S.histo.length-1;i>=0;i--){
    var ex=S.histo[i].ex||[];
    for(var j=0;j<ex.length;j++) if(ex[j].n===nom&&ex[j].series&&ex[j].series.length) return ex[j].series;
  }
  return null;
}
function topCharge(series){var m=0;for(var i=0;i<series.length;i++) if(series[i].kg>m) m=series[i].kg;return m;}
function histoExercice(nom){
  var out=[];
  for(var i=0;i<S.histo.length;i++){
    var ex=S.histo[i].ex||[];
    for(var j=0;j<ex.length;j++) if(ex[j].n===nom&&ex[j].series&&ex[j].series.length){
      var t=topCharge(ex[j].series); if(t>0) out.push({date:S.histo[i].date,kg:t});
    }
  }
  return out;
}

/* ================= liste des étapes d'une séance ================= */
/* Une étape = un écran. On ne montre jamais plus d'une étape à la fois. */
function etapes(se){
  var L=[];
  se.ex.forEach(function(ex,i){
    if(ex.type==='abs'){ L.push({t:'abs',i:i,ex:ex,cle:'a'+i,repos:0}); }
    else if(ex.type==='circuit'){
      var nT=Math.max(ex.rounds,(S.courant&&S.courant.tours&&S.courant.tours[i])||0);
      for(var r=0;r<nT;r++) L.push({t:'tour',i:i,r:r,ex:ex,repos:ex.restAfter});
    }
    else if(ex.type==='superset'){
      for(var s=0;s<ex.sets;s++){
        L.push({t:'serie',i:i,s:s,ex:ex,mv:ex.a,cle:i+'s'+s,repos:0,duo:'1 sur 2'});
        L.push({t:'serie',i:i,s:s,ex:ex,mv:ex.b,cle:i+'b'+s,repos:S.settings.rest,duo:'2 sur 2'});
      }
    }
    else for(var s2=0;s2<ex.sets;s2++) L.push({t:'serie',i:i,s:s2,ex:ex,mv:ex,cle:i+'s'+s2,repos:S.settings.rest});
  });
  return L;
}
function estFaite(e){
  if(e.t==='tour'){
    for(var m=0;m<e.ex.items.length;m++) if(!S.courant.faits[e.i+'r'+e.r+'m'+m]) return false;
    return true;
  }
  return !!S.courant.faits[e.cle];
}
function nomEtape(e){
  if(e.t==='abs') return "6 minutes d'abdos";
  if(e.t==='tour') return e.ex.n+' — tour '+(e.r+1);
  return (e.mv.court||e.mv.n)+' — série '+(e.s+1);
}

/* valeur proposée : la dernière fois, sinon la série précédente, sinon vide */
function valeurProposee(e,champ){
  var v=S.courant.vals[e.cle];
  if(v&&v[champ]!=null&&v[champ]!=='') return nb(v[champ]);
  if(champ==='reps') return nb(e.mv.reps)||10;
  for(var s=e.s-1;s>=0;s--){
    var pref=(e.cle.indexOf('b')>0&&e.ex.type==='superset')?'b':'s';
    var pv=S.courant.vals[e.i+pref+s];
    if(pv&&pv.kg) return nb(pv.kg);
  }
  var d=derniereFois(e.mv.n);
  if(d){ if(d[e.s]&&d[e.s].kg) return d[e.s].kg; if(d[0]&&d[0].kg) return d[0].kg; }
  return 0;
}

}
var chronoIv=null;
function majChrono(){
  clearInterval(chronoIv);
  if(!S.courant) return;
  var f=function(){
    var e=$('#chrono'); if(!e){clearInterval(chronoIv);return;}
    var s=(Date.now()-S.courant.debut)/1000;
    e.textContent=mmss(s); e.classList.toggle('on',s<3600);

/* ---------- accueil ---------- */
function nbSemaine(){
  var l=lundiDe(new Date()),n=0;
  for(var i=0;i<S.histo.length;i++) if(new Date(S.histo[i].date+'T12:00:00')>=l) n++;
  return n;
}
function dowSid(dow){for(var i=0;i<PROGRAM.length;i++) if(PROGRAM[i].dow===dow) return PROGRAM[i].id;return '';}
function serie(){
  var n=0,d=new Date();d.setHours(12,0,0,0);
  if(!faitLe(dowSid(d.getDay()),d)) d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){
    var j=d.getDay();
    if(j===0||j===6){ d.setDate(d.getDate()-1); continue; }
    if(faitLe(dowSid(j),d)) n++; else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

function vueAccueil(){
  var now=new Date(), h='';
  var se=sessDuJour(), dejaFait=se?faitLe(se.id,now):null;

  h+='<div class="hero">';
  if(se){
    h+='<div class="hero-top"><div>'

function objectif(mv){

function positionTexte(se,e,L,idx){

function blocStepper(champ,val,unite,pas){

   +'<button class="st-b" data-pas="'+champ+':'+(-pas)+'">−</button>'

   +'<button class="st-b" data-pas="'+champ+':'+pas+'">+</button></div>';

/* ================= graphiques ================= */
/* courbe simple : points {d:'AAAA-MM-JJ', v:nombre} */
function courbe(pts,unite){
  var W=320,H=126,pl=8,pr=8,pt=18,pb=20;
  if(pts.length<2){
    return '<div class="chart-vide">Il faut au moins deux mesures pour tracer la courbe.</div>';
  }
  var vs=pts.map(function(p){return p.v});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if(mx===mn){ mx=mn+1; mn=mn-1; }
  var marge=(mx-mn)*.15; mn-=marge; mx+=marge;
  var X=function(i){return pl+i*(W-pl-pr)/(pts.length-1)};
  var Y=function(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)};
  var ligne='',aire='';
  pts.forEach(function(p,i){
    var c=(i?'L':'M')+arr(X(i))+' '+arr(Y(p.v))+' ';
    ligne+=c; aire+=c;
  });
  aire+='L'+arr(X(pts.length-1))+' '+(H-pb)+' L'+pl+' '+(H-pb)+' Z';
  var der=pts[pts.length-1], prem=pts[0];
  var id='g'+Math.round(pts.length*1000+der.v*7);
  var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'
    +'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" class="gr-h"/><stop offset="1" class="gr-b"/></linearGradient></defs>'
    +'<line class="grid" x1="'+pl+'" y1="'+arr(Y(mx-marge))+'" x2="'+(W-pr)+'" y2="'+arr(Y(mx-marge))+'"/>'
    +'<line class="grid" x1="'+pl+'" y1="'+arr(Y(mn+marge))+'" x2="'+(W-pr)+'" y2="'+arr(Y(mn+marge))+'"/>'
    +'<path class="aire" d="'+aire+'" fill="url(#'+id+')"/>'
    +'<path class="trait" d="'+ligne+'"/>';
  pts.forEach(function(p,i){ if(i<pts.length-1) h+='<circle class="pt" cx="'+arr(X(i))+'" cy="'+arr(Y(p.v))+'" r="2.1"/>'; });
  h+='<circle class="pt-fin" cx="'+arr(X(pts.length-1))+'" cy="'+arr(Y(der.v))+'" r="4"/>'
    +'<text class="lab" x="'+pl+'" y="'+(H-6)+'">'+esc(jourCourt(prem.d))+'</text>'
    +'<text class="lab fin" x="'+(W-pr)+'" y="'+(H-6)+'">'+esc(jourCourt(der.d))+'</text>'
    +'<text class="lab" x="'+pl+'" y="12">'+arr(mx-marge)+' '+unite+'</text>'
    +'</svg>';
  return h;
}
/* barres : points {d, v} */
function barres(pts,unite){
  if(!pts.length) return '';
  var W=320,H=100,pb=18,pt=10,g=3;
  var mx=Math.max.apply(null,pts.map(function(p){return p.v}))||1;
  var bw=(W-g*(pts.length-1))/pts.length;
  var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  pts.forEach(function(p,i){
    var ht=Math.max(2,(p.v/mx)*(H-pt-pb));
    h+='<rect class="bar'+(i===pts.length-1?' last':'')+'" x="'+arr(i*(bw+g))+'" y="'+arr(H-pb-ht)+'" width="'+arr(bw)+'" height="'+arr(ht)+'" rx="3"/>';
  });
  h+='<text class="lab" x="0" y="'+(H-5)+'">'+esc(jourCourt(pts[0].d))+'</text>'
    +'<text class="lab fin" x="'+W+'" y="'+(H-5)+'">'+esc(jourCourt(pts[pts.length-1].d))+'</text></svg>';
  return h;
}
function jourCourt(d){
  var x=new Date(d+'T12:00:00');
  return x.getDate()+' '+MOIS[x.getMonth()].replace('.','');
}

/* ================= poids du corps ================= */
function poidsTrie(){ return S.poids.slice().sort(function(a,b){return a.d<b.d?-1:1}); }
function poidsActuel(){ var l=poidsTrie(); return l.length?l[l.length-1].kg:0; }
function poidsIlYA(jours){
  var l=poidsTrie(); if(!l.length) return null;
  var cible=Date.now()-jours*86400000, best=null, ecart=Infinity;
  l.forEach(function(p){
    var e=Math.abs(new Date(p.d+'T12:00:00').getTime()-cible);
    if(e<ecart){ecart=e;best=p;}
  });
  return (ecart<jours*.6*86400000||l.length===1)?best:null;
}
function notePoids(kg){
  var k=dkey();
  var found=false;
  S.poids.forEach(function(p){ if(p.d===k){p.kg=kg;found=true;} });
  if(!found) S.poids.push({d:k,kg:kg});
  save();
}

/* ================= progrès ================= */
var EXO=null;   // exercice ouvert en détail

function vueProgres(){
  if(EXO) return vueExercice(EXO);
  var h=cartePoids();
  h+=carteMois();
  var lignes=listeExercices();
  if(!lignes.length){
    h+='<div class="empty"><b>Pas encore de charges</b>Fais ta première séance. Tes charges et tes records apparaîtront ici tout seuls.</div>';
    return h;
  }
  var aug=lignes.filter(function(l){return stagne(l.h)});
  if(aug.length){
    h+='<div class="card pad" style="border-color:var(--warn);background:var(--warn-soft)">'
      +'<div class="eyebrow" style="color:var(--warn)">À augmenter</div>'
      +'<div class="small" style="margin-top:5px">'+aug.map(function(l){return esc(l.n)}).join(', ')
      +' — pas d\'augmentation depuis 3 semaines. Monte la charge.</div></div>';
  }
  h+='<h2 class="sec">Tes records</h2><div class="card">';
  lignes.forEach(function(l){
    var record=0; l.h.forEach(function(p){ if(p.kg>record) record=p.kg; });
    var delta=l.h[l.h.length-1].kg-l.h[0].kg;
    h+='<button class="prow" data-exo="'+esc(l.n)+'">'
      +'<div class="t"><b>'+esc(l.n)+'</b><span>'+l.h.length+' séance'+(l.h.length>1?'s':'')
      +(delta>0?' · <span class="up">+'+arr(delta)+' kg</span> depuis le début':(delta<0?' · '+arr(delta)+' kg':''))+'</span>'
      +(stagne(l.h)?'<span class="flag">à augmenter</span>':'')+'</div>'
      +spark(l.h)+'<div class="v">'+arr(record)+'<em>kg</em></div></button>';
  });
  h+='</div><div class="small muted" style="padding:0 4px">Touche un exercice pour voir son détail.</div>';
  h+=carteVolume();
  return h;
}

function listeExercices(){
  var noms={},out=[];
  PROGRAM.forEach(function(p){p.ex.forEach(function(e){
    if(e.type==='superset'){noms[e.a.n]=1;noms[e.b.n]=1;}
    else if(!e.type) noms[e.n]=1;
  })});
  for(var n in noms){ var hi=histoExercice(n); if(hi.length) out.push({n:n,h:hi}); }
  out.sort(function(a,b){return b.h[b.h.length-1].kg-a.h[a.h.length-1].kg});
  return out;
}

function cartePoids(){
  var l=poidsTrie(), act=poidsActuel();
  var prop=act||75;
  var h='<div class="card pad"><div class="eyebrow">Poids du corps</div>';
  if(l.length){
    var d7=poidsIlYA(7), d30=poidsIlYA(30);
    h+='<div class="poids-h"><b class="num">'+arr(act)+'</b><span>kg</span></div>';
    var deltas=[];
    if(d7&&d7.d!==l[l.length-1].d) deltas.push(badgeDelta(act-d7.kg,'7 jours'));
    if(d30&&d30.d!==l[l.length-1].d) deltas.push(badgeDelta(act-d30.kg,'30 jours'));
    if(deltas.length) h+='<div class="deltas">'+deltas.join('')+'</div>';
    h+=courbe(l.slice(-40).map(function(p){return {d:p.d,v:p.kg}}),'kg');
    h+='<div class="small muted" style="margin-top:2px">'+l.length+' mesure'+(l.length>1?'s':'')
      +' · dernière le '+jourCourt(l[l.length-1].d)+'</div>';
  }else{
    h+='<div class="small muted" style="margin:6px 0 2px">Note ton poids une fois par semaine, toujours au même moment. Le matin à jeun, c\'est le plus fiable.</div>';
  }
  h+='<div class="stepper" style="margin-top:14px">'
    +'<div class="st-row">'
    +'<button class="st-b" data-poids="-0.5">−</button>'
    +'<button class="st-v" data-editpoids="1"><b>'+arr(prop)+'</b><span>kg</span></button>'
    +'<button class="st-b" data-poids="0.5">+</button></div>'
    +'<button class="btn" id="notePoids" style="margin-top:10px;font-size:19px;padding:13px">'
    +(l.length&&l[l.length-1].d===dkey()?'Corriger mon poids d\'aujourd\'hui':'Noter mon poids')+'</button>'
    +'</div></div>';
  return h;
}
function badgeDelta(v,quoi){
  var s=v>0?'+':'';
  var cls=Math.abs(v)<.2?'neutre':(v>0?'up':'down');
  return '<span class="delta '+cls+'">'+s+arr(v)+' kg <em>sur '+quoi+'</em></span>';
}

function carteMois(){
  var debut=new Date(); debut.setDate(1); debut.setHours(0,0,0,0);
  var mois=S.histo.filter(function(r){return new Date(r.date+'T12:00:00')>=debut});
  var tonnage=0, records=0;
  mois.forEach(function(r){ tonnage+=r.volume||0; records+=r.records||0; });
  var prog=progressionCharges(30);
  return '<div class="stats">'
    +'<div class="stat"><b class="num">'+mois.length+'</b><span>Séances ce mois</span></div>'
    +'<div class="stat"><b class="num">'+(tonnage>=1000?arr(tonnage/1000)+'<span style="font-size:15px;color:var(--ink2)">t</span>':Math.round(tonnage)+'<span style="font-size:15px;color:var(--ink2)">kg</span>')+'</b><span>Soulevés</span></div>'
    +'<div class="stat"><b class="num'+(prog>0?' up':'')+'">'+(prog>0?'+':'')+(prog===null?'—':arr(prog)+'<span style="font-size:15px">%</span>')+'</b><span>Charges 30 j</span></div>'
    +'</div>';
}
/* progression moyenne des charges sur N jours, en % */
function progressionCharges(jours){
  var lim=Date.now()-jours*86400000, tot=0, n=0;
  listeExercices().forEach(function(l){
    var avant=null, apres=null;
    l.h.forEach(function(p){
      var t=new Date(p.date+'T12:00:00').getTime();
      if(t<lim){ avant=p.kg; } else { if(avant===null&&!apres) avant=p.kg; apres=Math.max(apres||0,p.kg); }
    });
    if(avant&&apres&&avant>0&&apres!==avant){ tot+=(apres-avant)/avant*100; n++; }
  });
  return n?tot/n:null;
}

/* ---------- détail d'un exercice ---------- */
function vueExercice(nom){
  var hi=histoExercice(nom);
  var record=0, dateRec='';
  hi.forEach(function(p){ if(p.kg>record){record=p.kg;dateRec=p.date;} });
  var delta=hi.length>1?hi[hi.length-1].kg-hi[0].kg:0;

  var h='<button class="retour" id="retourProg">‹ Tous les exercices</button>';
  h+='<div class="card pad"><div class="eyebrow">'+esc(nom)+'</div>'
    +'<div class="poids-h"><b class="num">'+arr(record)+'</b><span>kg</span></div>'
    +'<div class="small muted">Record, le '+jourCourt(dateRec)+'</div>';
  if(hi.length>1){
    h+='<div class="deltas">'+badgeDeltaKg(delta)+'</div>';
    h+=courbe(hi.map(function(p){return {d:p.date,v:p.kg}}),'kg');
  }
  h+='</div>';

  h+='<h2 class="sec">Séance par séance</h2><div class="card">';
  var lignes=[];
  for(var i=S.histo.length-1;i>=0;i--){
    var ex=(S.histo[i].ex||[]).filter(function(e){return e.n===nom});
    ex.forEach(function(e){ lignes.push({date:S.histo[i].date,series:e.series}); });
  }
  lignes.forEach(function(l){
    var d=new Date(l.date+'T12:00:00');
    var top=topCharge(l.series);
    h+='<div class="hrow"><div class="d"><b class="num">'+d.getDate()+'</b><span>'+MOIS[d.getMonth()].replace('.','').slice(0,3)+'</span></div>'
      +'<div class="t"><b>'+arr(top)+' kg'+(top>=record?' <span class="flag rec">record</span>':'')+'</b>'
      +'<span>'+l.series.map(function(s){return arr(s.kg)+'×'+s.reps}).join('  ·  ')+'</span></div></div>';
  });
  h+='</div>';
  return h;
}
function badgeDeltaKg(v){
  var cls=v>0?'up':(v<0?'down':'neutre');
  return '<span class="delta '+cls+'">'+(v>0?'+':'')+arr(v)+' kg <em>depuis le début</em></span>';
}
function stagne(hi){
  if(hi.length<2) return false;
  var max=0,dateMax=hi[0].date;
  hi.forEach(function(p){ if(p.kg>max){max=p.kg;dateMax=p.date;} });
  return (Date.now()-new Date(dateMax+'T12:00:00').getTime())/86400000>=21;
}
function spark(hi){
  var pts=hi.slice(-12), w=66,ht=26,p=3;
  if(pts.length<2) return '<svg class="spark" viewBox="0 0 66 26"></svg>';
  var mn=Infinity,mx=-Infinity;
  pts.forEach(function(o){mn=Math.min(mn,o.kg);mx=Math.max(mx,o.kg)});
  if(mx===mn) mx=mn+1;
  var d='';
  pts.forEach(function(o,i){
    var x=p+i*(w-2*p)/(pts.length-1), y=ht-p-(o.kg-mn)/(mx-mn)*(ht-2*p);
    d+=(i?'L':'M')+arr(x)+' '+arr(y)+' ';
  });
  var ly=ht-p-(pts[pts.length-1].kg-mn)/(mx-mn)*(ht-2*p);
  return '<svg class="spark" viewBox="0 0 66 26"><path d="'+d+'"/><circle cx="'+(w-p)+'" cy="'+arr(ly)+'" r="2.4"/></svg>';
}

  var h='',parMois={};
  S.histo.slice().reverse().forEach(function(r){
    var d=new Date(r.date+'T12:00:00');
    (parMois[d.getFullYear()+'-'+d.getMonth()]=parMois[d.getFullYear()+'-'+d.getMonth()]||[]).push(r);
  });
  Object.keys(parMois).forEach(function(k){
    var l=parMois[k], d0=new Date(l[0].date+'T12:00:00');
    h+='<h2 class="sec">'+MOIS[d0.getMonth()].replace('.','')+' '+d0.getFullYear()+'</h2><div class="card">';
    l.forEach(function(r){
      var d=new Date(r.date+'T12:00:00'), det=[];
      if(r.duree) det.push(Math.max(1,Math.round(r.duree/60000))+' min');
      if(r.series) det.push(r.series+' série'+(r.series>1?'s':''));
      if(r.tours) det.push(r.tours+' tour'+(r.tours>1?'s':''));
      if(r.volume) det.push(Math.round(r.volume)+' kg soulevés');
      h+='<div class="hrow"><div class="d"><b class="num">'+d.getDate()+'</b><span>'+JOURS[d.getDay()].slice(0,3)+'</span></div>'
        +'<div class="t"><b>'+esc(r.nom)+'</b><span>'+det.join(' · ')+'</span></div></div>';
    });
    h+='</div>';
  });
  return h;
}

/* ---- steppers ---- */
function etapeActive(){
  var L=etapes(sess(S.courant.sid));
  return L[Math.min(S.courant.etape||0,L.length-1)];
}
function majValeur(champ,delta,relatif){
  var e=etapeActive(), cur=valeurProposee(e,champ);
  var v=relatif?cur+delta:delta;
  if(v<0) v=0;
  if(champ==='reps') v=Math.round(v);
  S.courant.vals[e.cle]=S.courant.vals[e.cle]||{};
  S.courant.vals[e.cle][champ]=arr(v);
  save();
  var b=document.querySelector('[data-edit="'+champ+'"] b');
  if(b) b.textContent=arr(v); else render();
}
function saisir(bouton,champ){
  var e=etapeActive(), cur=valeurProposee(e,champ);
  var span=bouton.querySelector('span').textContent;
  bouton.innerHTML='<input type="text" inputmode="decimal" value="'+arr(cur)+'"><span>'+span+'</span>';
  var inp=bouton.querySelector('input');
  inp.focus(); inp.select();
  function fin(){
    var v=nb(inp.value);
    majValeur(champ,v,false);
    render();
  }
  inp.addEventListener('blur',fin,{once:true});
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter') inp.blur(); });
}

/* ---- déplacement entre étapes ---- */
function deplacer(d){
  var L=etapes(sess(S.courant.sid));
  var i=Math.min(S.courant.etape||0,L.length-1)+d;
  S.courant.etape=Math.max(0,Math.min(L.length-1,i));
  save();window.scrollTo(0,0);render();
}
function etapeSuivanteNonFaite(){
  var L=etapes(sess(S.courant.sid)), i=Math.min(S.courant.etape||0,L.length-1);
  for(var k=i+1;k<L.length;k++) if(!estFaite(L[k])) return k;
  for(var k2=0;k2<L.length;k2++) if(!estFaite(L[k2])) return k2;
  return -1;
}

function validerEtape(){
  reveilAudio();
  var e=etapeActive();
  if(estFaite(e)){ delete S.courant.faits[e.cle]; save(); render(); return; }
  S.courant.faits[e.cle]=1;
  S.courant.vals[e.cle]=S.courant.vals[e.cle]||{};
  if(S.courant.vals[e.cle].kg==null) S.courant.vals[e.cle].kg=arr(valeurProposee(e,'kg'));
  if(S.courant.vals[e.cle].reps==null) S.courant.vals[e.cle].reps=arr(valeurProposee(e,'reps'));
  apres(e);
}
function finirTour(){
  reveilAudio();
  var e=etapeActive();
  for(var m=0;m<e.ex.items.length;m++) S.courant.faits[e.i+'r'+e.r+'m'+m]=1;
  apres(e);
}
function apres(e){
  var suiv=etapeSuivanteNonFaite();
  if(suiv>=0) S.courant.etape=suiv;
  save();window.scrollTo(0,0);render();
  if(e.repos) repos(e.repos);
  else if(suiv<0) toast('Séance complète. Tu peux la terminer.');
}

function demarrer(sid){
  if(S.courant&&S.courant.sid!==sid&&!confirm('Une séance est déjà en cours. La remplacer ?')) return;
  if(!S.courant||S.courant.sid!==sid) S.courant={sid:sid,debut:Date.now(),vals:{},faits:{},tours:{},lest:{},etape:0};
  MODE='guide';reveilAudio();garderEcran(true);save();go('home');
}

/* ================= repos ================= */
var rst={fin:0,total:0,iv:null,actif:false,sonne:false};
function repos(sec){
  clearInterval(rst.iv);
  rst.fin=Date.now()+sec*1000; rst.total=sec; rst.actif=true; rst.sonne=false;
  var L=etapes(sess(S.courant.sid)), e=L[Math.min(S.courant.etape||0,L.length-1)];
  $('#rsNext').innerHTML='<b>Ensuite</b><br>'+esc(nomEtape(e));
  $('#restScreen').hidden=false;
  tickRepos();
  rst.iv=setInterval(tickRepos,250);
}
function tickRepos(){
  var reste=(rst.fin-Date.now())/1000;
  $('#rsTime').textContent=mmss(Math.max(0,reste));
  $('#rsBar').style.width=Math.max(0,Math.min(100,reste/rst.total*100))+'%';
  $('#restScreen').classList.toggle('hot',reste<=10);
  if(reste<=3&&reste>0&&Math.ceil(reste)!==rst.dernier){ rst.dernier=Math.ceil(reste); bipCourt(); }
  if(reste<=0&&!rst.sonne){ rst.sonne=true; bipFin(); setTimeout(fermerRepos,1400); }
}
function fermerRepos(){
  clearInterval(rst.iv);rst.actif=false;
  $('#restScreen').hidden=true;$('#restScreen').classList.remove('hot');
}
$('#rsSkip').addEventListener('click',function(){ reveilAudio(); fermerRepos(); });
$('#rsMinus').addEventListener('click',function(){ rst.fin-=15000;rst.dernier=0;tickRepos(); });
$('#rsPlus').addEventListener('click',function(){ rst.fin+=15000;rst.total+=15;rst.dernier=0;tickRepos(); });

/* ================= chrono abdos ================= */
var abs={i:0,fin:0,iv:null,ex:null,pause:false,reste:30,actif:false};
function lancerAbdos(exIdx){
  reveilAudio();
  abs={i:0,fin:Date.now()+30000,iv:null,ex:exIdx,pause:false,reste:30,actif:true};
  $('#absOverlay').hidden=false;$('#abPause').textContent='Pause';
  bipPhase(false);majAbdos();
  abs.iv=setInterval(tickAbdos,250);
  garderEcran(true);
}
function tickAbdos(){
  if(abs.pause) return;
  var reste=(abs.fin-Date.now())/1000;
  if(reste<=0){
    abs.i++;
    if(abs.i>=12){ finAbdos(true); return; }
    abs.fin=Date.now()+30000; reste=30; bipPhase(abs.i%2===1);
  }else if(reste<=3&&Math.ceil(reste)!==abs.dernier){ abs.dernier=Math.ceil(reste); bipCourt(); }
  abs.reste=reste;majAbdos();
}
function majAbdos(){
  var gainage=abs.i%2===0;
  $('#absOverlay').classList.toggle('abdos',!gainage);
  $('#abPhase').textContent=gainage?'GAINAGE':'ABDOS';
  $('#abTime').textContent=Math.max(0,Math.ceil(abs.reste));
  $('#abNext').textContent=abs.i>=11?'Dernier bloc !':('Ensuite : '+(gainage?'abdos':'gainage'));
  $('#abTotal').textContent=mmss((11-abs.i)*30+abs.reste)+' restantes';
  var d='';for(var k=0;k<12;k++) d+='<i class="'+(k<abs.i?'on':'')+'"></i>';
  $('#abDots').innerHTML=d;
}
function finAbdos(ok){
  clearInterval(abs.iv);abs.actif=false;
  $('#absOverlay').hidden=true;$('#absOverlay').classList.remove('abdos');
  if(ok){
    bipFin();
    if(S.courant&&abs.ex!=null){ S.courant.faits['a'+abs.ex]=1;save(); }
    toast('6 minutes d\'abdos bouclées 💪');
    var suiv=etapeSuivanteNonFaite();
    if(suiv>=0&&S.courant){ S.courant.etape=suiv;save(); }
  }
  render();
}
$('#abQuit').addEventListener('click',function(){finAbdos(false)});
$('#abPause').addEventListener('click',function(){
  abs.pause=!abs.pause;
  if(!abs.pause) abs.fin=Date.now()+abs.reste*1000;
  this.textContent=abs.pause?'Reprendre':'Pause';
});

/* ================= fin de séance ================= */
function terminer(){
  var se=sess(S.courant.sid);
  var rec={sid:se.id,jour:se.jour,nom:se.nom,date:dkey(),debut:S.courant.debut,fin:Date.now(),
           duree:Date.now()-S.courant.debut,ex:[],volume:0,series:0,tours:0};
  se.ex.forEach(function(ex,i){
    if(ex.type==='abs') return;
    if(ex.type==='circuit'){
      var nT=Math.max(ex.rounds,(S.courant.tours&&S.courant.tours[i])||0),t=0;
      for(var r=0;r<nT;r++){
        var c=true;
        for(var m=0;m<ex.items.length;m++) if(!S.courant.faits[i+'r'+r+'m'+m]) c=false;
        if(c) t++;
      }
      rec.tours+=t;rec.series+=t*ex.items.length;
      return;
    }
    var mvts=(ex.type==='superset')
      ? [{n:ex.a.n,p:'s',reps:ex.a.reps},{n:ex.b.n,p:'b',reps:ex.b.reps}]
      : [{n:ex.n,p:'s',reps:ex.reps}];
    mvts.forEach(function(o){
      var series=[];
      for(var s=0;s<ex.sets;s++){
        if(!S.courant.faits[i+o.p+s]) continue;
        var v=S.courant.vals[i+o.p+s]||{};
        var kg=nb(v.kg), rp=nb(v.reps)||nb(o.reps);
        if(kg||rp) series.push({kg:kg,reps:rp});
        rec.volume+=kg*rp; rec.series++;
      }
      if(series.length) rec.ex.push({n:o.n,series:series});
    });
  });
  var reste=etapes(se).filter(function(e){return !estFaite(e)}).length;
  if(!rec.series&&!rec.tours){ if(!confirm('Rien n\'est coché. Enregistrer quand même ?')) return; }
  else if(reste&&!confirm('Il reste '+reste+' étape'+(reste>1?'s':'')+' à faire. Terminer la séance maintenant ?')) return;

  /* records battus — se calcule avant d'ajouter la séance à l'historique */
  var records=[];
  rec.ex.forEach(function(e){
    var ancien=0;
    histoExercice(e.n).forEach(function(p){ if(p.kg>ancien) ancien=p.kg; });
    var top=topCharge(e.series);
    if(ancien>0&&top>ancien) records.push(e.n);
  });
  rec.records=records.length;

  S.histo.push(rec);
  S.courant=null;MODE='guide';garderEcran(false);save();
  toast(records.length
    ? records.length+' record'+(records.length>1?'s battus':' battu')+' 💪 — '+Math.max(1,Math.round(rec.duree/60000))+' min'
    : 'Séance enregistrée — '+Math.max(1,Math.round(rec.duree/60000))+' min');
  go('home');
}

/* ================= export / import ================= */
function exporter(){
  var b=new Blob([JSON.stringify({v:1,d:S},null,1)],{type:'application/json'});
  var u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='programme-muscu-'+dkey()+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},400);
  toast('Fichier de sauvegarde créé');
}
function importer(){
  var i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=function(){
    var f=i.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result), d=o.d||o;
        if(!d||!d.histo) throw 0;
        S.histo=d.histo||[];S.prot=d.prot||{};S.poids=d.poids||[];
        if(d.settings) for(var k in d.settings) S.settings[k]=d.settings[k];
        S.courant=null;save();go('home');toast('Sauvegarde restaurée');
      }catch(e){ toast('Fichier illisible'); }
    };
    r.readAsText(f);
  };
  i.click();
}

/* ================= démarrage ================= */
if(S.courant&&Date.now()-S.courant.debut>10*3600*1000) S.courant=null;
if(S.courant&&S.courant.etape==null) S.courant.etape=0;
document.addEventListener('touchstart',reveilAudio,{once:true});
document.addEventListener('click',reveilAudio,{once:true});
render();
})();
</script>
